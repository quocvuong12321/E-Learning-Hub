server:
  port: 8081
  servlet:
    context-path: /elearning-hub
    encoding:
      enable: true
      charset: UTF-8
      force: true

spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/auth/callback/google"
            scope:
              - email
              - profile
            client-name: Google
      provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://www.googleapis.com/oauth2/v4/token
            user-info-uri: https://www.googleapis.com/oauth2/v1/userinfo
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
            user-name-attribute: sub
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:elearning_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          # Đảm bảo Hibernate sử dụng múi giờ Việt Nam khi lưu/đọc ngày giờ
          time_zone: Asia/Ho_Chi_Minh
    show-sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB


oauth2:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    authorization-url: https://accounts.google.com/o/oauth2/v2/auth
    token-url: https://www.googleapis.com/oauth2/v4/token
    user-info-url: https://www.googleapis.com/oauth2/v1/userinfo
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:8081/elearning-hub/auth/oauth2/callback} # ✅ URL frontend redirect

jwt:
  signerKey: ${JWT_SECRET:2e2223fa49b87178e75ad9300192eeb241a1fd2a35c4c95c1d2a7a6fefd72d86}
file:
  upload-dir: ${IMAGE_DIR:./uploads/images}
logging:
  level:
    org.springframework.security: DEBUG


